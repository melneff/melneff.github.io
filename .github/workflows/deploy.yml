name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Clean up old built files
        run: |
          rm -f index.html
          rm -rf assets/

      - name: Build
        run: npm run build

      - name: Copy built files to root
        run: |
          rm -f index.html
          cp dist/index.html .
          mkdir -p assets
          cp -r dist/assets/* assets/
          cp -r dist/*.svg . || true

      - name: Commit and push built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ *.svg
          git commit -m "Build: update assets" || true
          git push